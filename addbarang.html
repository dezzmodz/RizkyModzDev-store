<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes"><title>Tambah Produk — Store Dezz</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Segoe UI,system-ui,sans-serif;background:#08090d;color:#e7eaf0;padding:20px;min-height:100vh}.container{max-width:900px;margin:auto;padding:30px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}h1{margin-bottom:5px;font-size:2rem;background:linear-gradient(135deg,#fff,#8ab4f8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.subtitle{color:#858b98;margin-bottom:28px;font-size:.94rem}.form-group{margin-bottom:18px}label{display:block;margin-bottom:7px;color:#cdd2dc;font-size:.9rem;font-weight:600}input,textarea,select{width:100%;padding:12px 14px;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:rgba(255,255,255,.045);color:#fff;outline:0;font-size:1rem}input:focus,textarea:focus,select:focus{border-color:#3978ff;box-shadow:0 0 0 3px rgba(57,120,255,.1)}textarea{min-height:80px;resize:vertical}select option{background:#171923}.variant-row{display:grid;grid-template-columns:minmax(0,1fr) 180px auto;gap:10px;margin-bottom:10px}.btn-remove,.btn-add-variant,.btn-copy,.btn-clear,.btn-submit{cursor:pointer;font-weight:700}.btn-remove{padding:10px 14px;border:1px solid rgba(255,70,70,.18);border-radius:12px;background:rgba(255,70,70,.1);color:#ff6666}.btn-add-variant{padding:9px 18px;border:1px solid rgba(57,120,255,.2);border-radius:30px;background:rgba(57,120,255,.1);color:#8ab4f8}.btn-submit{width:100%;padding:13px;margin-top:8px;border:0;border-radius:40px;background:linear-gradient(135deg,#2868ff,#4b8dff);color:#fff;font-size:1rem;box-shadow:0 10px 30px rgba(40,104,255,.2)}.history-section{margin-top:38px;padding-top:24px;border-top:1px solid rgba(255,255,255,.07)}.history-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.history-header h2{font-size:1.25rem}.product-count{color:#777;font-size:.9rem}.product-count strong{color:#fff}.history-actions{display:flex;gap:8px}.btn-copy,.btn-clear{padding:8px 17px;border-radius:30px}.btn-copy{border:1px solid rgba(0,210,100,.2);background:rgba(0,210,100,.12);color:#69db7c}.btn-clear{border:1px solid rgba(255,70,70,.15);background:rgba(255,70,70,.1);color:#ff6b6b}#historyOutput{width:100%;min-height:260px;padding:15px;border:1px solid rgba(255,255,255,.07);border-radius:13px;background:rgba(0,0,0,.45);color:#b9ddff;font:14px/1.6 Consolas,'Courier New',monospace;white-space:pre;resize:vertical}.warning{display:none;margin-top:5px;color:#ff6969;font-size:.8rem}.warning.show{display:block}.hidden{display:none}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9999;padding:11px 22px;border:1px solid rgba(255,255,255,.08);border-radius:40px;background:rgba(20,21,28,.97);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.3)}@media(max-width:600px){body{padding:10px}.container{padding:17px}.variant-row{grid-template-columns:1fr}.btn-remove{justify-self:end}.history-actions{width:100%}.history-actions button{flex:1}}</style></head><body><div class="container"><h1>+ Tambah Produk</h1><p class="subtitle">Tambahkan produk ke Store Dezz. <strong style="color:#ffd21c">ID produk wajib unik.</strong></p><form id="productForm"><div class="form-group"><label>ID Produk</label><input id="productId" type="text" placeholder="dezzofm" required><div id="idWarning" class="warning">⚠️ ID produk sudah digunakan.</div></div><div class="form-group"><label>Nama Produk</label><input id="productName" type="text" placeholder="HOLOGRAM FREE" required></div><div class="form-group"><label>Kategori</label><select id="productCategory"><option value="Buy">Buy (Berbayar)</option><option value="Free">Free (Gratis)</option></select></div><div class="form-group"><label>Deskripsi</label><textarea id="productDesc" placeholder="Deskripsi produk" required></textarea></div><div id="stockGroup" class="form-group"><label>Stok</label><input id="productStock" type="number" min="0" step="1" value="9999"></div><div id="downloadGroup" class="form-group hidden"><label>URL Download</label><input id="productDownloadUrl" type="url" placeholder="https://..."></div><div id="variantGroup" class="form-group"><label>Varian Produk</label><div id="variantContainer"></div><button id="addVariantBtn" class="btn-add-variant" type="button">+ Tambah Varian</button></div><button class="btn-submit" type="submit">Simpan & Tambahkan</button></form><div class="history-section"><div class="history-header"><h2>Riwayat Produk <span id="countLabel" class="product-count">(<strong>0</strong>)</span></h2><div class="history-actions"><button id="copyAllBtn" class="btn-copy" type="button">Salin Semua</button><button id="clearHistoryBtn" class="btn-clear" type="button">Hapus Semua</button></div></div><textarea id="historyOutput" readonly placeholder="Belum ada produk."></textarea><p style="color:#666;font-size:.83rem;margin-top:8px">Hasil siap di-copy ke array products di script.js.</p></div></div><div id="toastContainer"></div><script>(()=>{let products=[],variants=[{name:"Default",price:10000}];const $=i=>document.getElementById(i),form=$("productForm"),cat=$("productCategory"),vc=$("variantContainer"),vg=$("variantGroup"),sg=$("stockGroup"),dg=$("downloadGroup"),stock=$("productStock"),download=$("productDownloadUrl"),output=$("historyOutput"),count=$("countLabel"),pid=$("productId"),warn=$("idWarning");const escH=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"),escJ=s=>String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\r/g,"\\r").replace(/\n/g,"\\n"),slug=s=>String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"default";function render(){vc.innerHTML="";variants.forEach((v,i)=>{let d=document.createElement("div");d.className="variant-row";d.innerHTML='<input class="vn" data-i="'+i+'" type="text" value="'+escH(v.name)+'" placeholder="Nama varian bebas, contoh: 1 Days"><input class="vp" data-i="'+i+'" type="number" min="0" step="1" value="'+(Number(v.price)||0)+'" placeholder="Harga"><button type="button" class="btn-remove" data-i="'+i+'">HAPUS</button>';vc.appendChild(d)});vc.querySelectorAll(".vn").forEach(e=>e.oninput=()=>variants[+e.dataset.i].name=e.value);vc.querySelectorAll(".vp").forEach(e=>e.oninput=()=>variants[+e.dataset.i].price=Math.max(0,Number(e.value)||0));vc.querySelectorAll(".btn-remove").forEach(e=>e.onclick=()=>{if(variants.length===1)return toast("Minimal satu varian untuk Buy.");variants.splice(+e.dataset.i,1);render()})}function toggle(){let free=cat.value==="Free";vg.classList.toggle("hidden",free);sg.classList.toggle("hidden",free);dg.classList.toggle("hidden",!free);if(free){stock.value=9999}else if(!variants.length)variants=[{name:"Default",price:10000}];render()}function format(p){let r="{\n";r+="  id: '"+escJ(p.id)+"',\n";r+="  name: '"+escJ(p.name)+"',\n";r+="  category: '"+escJ(p.category)+"',\n";r+="  description: '"+escJ(p.description)+"',\n";r+="  variants: [\n";p.variants.forEach((v,i)=>r+="    {id: '"+escJ(v.id)+"', name: '"+escJ(v.name)+"', price: "+v.price+"}"+(i<p.variants.length-1?",":"")+"\n");r+="  ],\n";r+="  stock: "+p.stock+",\n";r+="  isFree: "+p.isFree+",\n";r+="  downloadUrl: "+(p.downloadUrl!==null?"'"+escJ(p.downloadUrl)+"'":"null")+"\n}";return r}function update(){output.value=products.length?products.map(format).join(",\n"):"Belum ada produk.";count.innerHTML="(<strong>"+products.length+"</strong>)"}function toast(m){let t=document.createElement("div");t.className="toast";t.textContent=m;$("toastContainer").appendChild(t);setTimeout(()=>t.remove(),2500)}pid.oninput=()=>{let v=pid.value.trim();warn.classList.toggle("show",!!v&&products.some(p=>p.id===v))};cat.onchange=toggle;$("addVariantBtn").onclick=()=>{if(cat.value==="Buy"){variants.push({name:"",price:0});render()}};form.onsubmit=e=>{e.preventDefault();let id=pid.value.trim(),name=$("productName").value.trim(),category=cat.value,description=$("productDesc").value.trim(),free=category==="Free";if(!id||!name||!description)return toast("Lengkapi semua data.");if(products.some(p=>p.id===id))return toast("ID produk sudah digunakan.");let vs;if(free)vs=[{id:"default-1000",name:"Default",price:0}];else{let valid=variants.filter(v=>v.name.trim()!=="");if(!valid.length)return toast("Buy wajib memiliki minimal satu varian.");vs=valid.map((v,i)=>({id:slug(v.name)+"-"+(1000+i),name:v.name.trim(),price:Math.max(0,Math.floor(Number(v.price)||0))}))}products.push({id:id,name:name,category:category,description:description,variants:vs,stock:free?9999:Math.max(0,Math.floor(Number(stock.value)||0)),isFree:free,downloadUrl:free?(download.value.trim()||null):null});update();form.reset();cat.value="Buy";stock.value=9999;download.value="";variants=[{name:"Default",price:10000}];warn.classList.remove("show");toggle();toast("Produk berhasil ditambahkan.")};$("copyAllBtn").onclick=async()=>{if(!products.length)return toast("Belum ada produk.");try{await navigator.clipboard.writeText(output.value)}catch(e){output.select();document.execCommand("copy")}toast("Berhasil disalin.")};$("clearHistoryBtn").onclick=()=>{if(!products.length)return toast("Riwayat kosong.");if(confirm("Hapus semua produk?")){products=[];update();toast("Semua produk dihapus.")}};toggle();update()})();</script></body></html>
