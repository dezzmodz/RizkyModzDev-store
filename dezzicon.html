}function palCut(px,n){if(!px.length)return[];let bx=[px];while(bx.length<n){let bi=-1,br=-1,bc=0;for(let i=0;i<bx.length;i++){if(bx[i].length<2)continue;for(let c=0;c<3;c++){let mn=255,mx=0;for(const p of bx[i]){if(p[c]<mn)mn=p[c];if(p[c]>mx)mx=p[c]}const r=mx-mn;if(r>br){br=r;bi=i;bc=c}}}if(bi<0||br<=0)break;const b=bx[bi];b.sort((a,c)=>a[bc]-c[bc]);const m=Math.floor(b.length/2);bx.splice(bi,1,b.slice(0,m),b.slice(m))}return bx.map(b=>{let r=0,g=0,bl=0;for(const p of b){r+=p[0];g+=p[1];bl+=p[2]}const l=b.length||1;return[Math.round(r/l),Math.round(g/l),Math.round(bl/l)]})}function refine(px,cent,it){if(!px.length||!cent.length)return cent;let pal=cent.map(c=>c.slice());for(let k=0;k<it;k++){const s=pal.map(()=>[0,0,0,0]);for(const p of px){let bi=0,bd=Infinity;for(let j=0;j<pal.length;j++){const dr=p[0]-pal[j][0],dg=p[1]-pal[j][1],db=p[2]-pal[j][2];const dd=dr*dr+dg*dg+db*db;if(dd<bd){bd=dd;bi=j}}s[bi][0]+=p[0];s[bi][1]+=p[1];s[bi][2]+=p[2];s[bi][3]++}for(let j=0;j<pal.length;j++){if(s[j][3]>0){pal[j][0]=Math.round(s[j][0]/s[j][3]);pal[j][1]=Math.round(s[j][1]/s[j][3]);pal[j][2]=Math.round(s[j][2]/s[j][3])}}}return pal}function median3(d,w,h){const o=new Uint8ClampedArray(d);for(let y=1;y<h-1;y++){for(let x=1;x<w-1;x++){const i=(y*w+x)*4;for(let c=0;c<3;c++){const v=[d[((y-1)*w+(x-1))*4+c],d[((y-1)*w+x)*4+c],d[((y-1)*w+(x+1))*4+c],d[(y*w+(x-1))*4+c],d[i+c],d[(y*w+(x+1))*4+c],d[((y+1)*w+(x-1))*4+c],d[((y+1)*w+x)*4+c],d[((y+1)*w+(x+1))*4+c]];v.sort((a,b)=>a-b);o[i+c]=v[4]}o[i+3]=d[i+3]}}return o}function sobel(d,w,h,th){const g=new Uint8Array(w*h);for(let i=0;i<w*h;i++)g[i]=(d[i*4]*0.299+d[i*4+1]*0.587+d[i*4+2]*0.114)|0;const e=new Uint8Array(w*h);for(let y=1;y<h-1;y++){for(let x=1;x<w-1;x++){const i=y*w+x;const p=(yy,xx)=>g[yy*w+xx];const sx=(p(y-1,x+1)+2*p(y,x+1)+p(y+1,x+1))-(p(y-1,x-1)+2*p(y,x-1)+p(y+1,x-1));const sy=(p(y+1,x-1)+2*p(y+1,x)+p(y+1,x+1))-(p(y-1,x-1)+2*p(y-1,x)+p(y-1,x+1));const m=Math.sqrt(sx*sx+sy*sy);e[i]=m>th?1:0}}return e}function dil(m,w,h,it) unction buildSVG(items,vbW,vbH,bg){const p=['<?xml version="1.0" encoding="UTF-8"?>','<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+vbW+' '+vbH+'" width="'+vbW+'" height="'+vbH+'">'];if(bg&&bg!=='transparent')p.push('<path fill="'+bg+'" d="M0 0L'+vbW+' 0L'+vbW+' '+vbH+'L0 '+vbH+'Z"/>');for(const it of items)for(const d of it.ds)p.push('<path fill="'+it.fill+'" d="'+d+'"/>');p.push('</svg>');return p.join('')}function vSVG(s){if(!s)return{ok:false,err:'SVG kosong'};if(/<image|data:image|base64|blob:/i.test(s))return{ok:false,err:'SVG masih ada raster'};if(/<foreignObject/i.test(s))return{ok:false,err:'Ada foreignObject'};if(!/<svg[\s>]/i.test(s))return{ok:false,err:'Bukan svg'};if(!/<path[\s>]/i.test(s))return{ok:false,err:'Tidak ada path'};const vm=s.match(/viewBox="([^"]+)"/);if(!vm)return{ok:false,err:'viewBox kosong'};return{ok:true}}function s2x(s){const vm=s.match(/viewBox="([^"]+)"/);if(!vm)return{ok:false,err:'viewBox kosong'};const vb=vm[1].trim().split(/[\s,]+/).map(Number);const vw=vb[2],vh=vb[3];const paths=[];const rx=/<path\s+([^>]+?)\/>/g;let m;while((m=rx.exec(s))){const dm=m[1].match(/d="([^"]+)"/);if(!dm)continue;const fm=m[1].match(/fill="([^"]+)"/);const f=fm?fm[1]:'#000000';paths.push('<path android:fillColor="'+toARGB(f)+'" android:pathData="'+dm[1].replace(/\s+/g,' ').trim()+'"/>')}if(!paths.length)return{ok:false,err:'Tidak ada path'};const xml='<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="'+vw+'dp" android:height="'+vh+'dp" android:viewportWidth="'+vw+'" android:viewportHeight="'+vh+'">\n'+paths.join('\n')+'\n</vector>';return{ok:true,xml}}function dl(name,content,mime){try{const b=new Blob([content],{type:mime||'text/plain'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>{try{URL.revokeObjectURL(u)}catch(e){}},700);return true}catch(e){return
